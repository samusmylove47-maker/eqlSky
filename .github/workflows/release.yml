name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend
        run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: eqlSky ${{ github.ref_name }}
          releaseBody: Windows overlay for EverQuest Legends Plane of Sky class unlocks. Run the game borderless. See README for /log on and inventory dump steps.
          releaseDraft: true
          prerelease: false
          args: --target x86_64-pc-windows-msvc
